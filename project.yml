name: PiHoleMenuApp
options:
  bundleIdPrefix: com.pihole.menuapp
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  SimpleKeychain:
    url: https://github.com/auth0/SimpleKeychain
    from: 1.3.0

targets:
  PiHoleMenuApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/PiHoleMenuApp
    settings:
      base:
        INFOPLIST_FILE: Sources/PiHoleMenuApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PiHoleMenuApp/Resources/PiHoleMenuApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pihole.menuapp
    dependencies:
      - package: SimpleKeychain
    preBuildScripts:
      - name: Generate Xcode project with XcodeGen
        script: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate --project . --quiet
          else
            echo "warning: XcodeGen not installed - install via 'brew install xcodegen'"
          fi
      - name: Run SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint
          else
            echo "warning: SwiftLint not installed - install via 'brew install swiftlint'"
          fi
      - name: Run swift-format lint
        script: |
          FORMAT_BIN=$(xcrun --find swift-format 2>/dev/null)
          if [ -n "$FORMAT_BIN" ]; then
            "$FORMAT_BIN" lint --recursive --strict Sources/ Tests/
          else
            echo "warning: swift-format not found in Xcode toolchain"
          fi

  PiHoleMenuAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PiHoleMenuAppTests
    dependencies:
      - target: PiHoleMenuApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pihole.menuapp.tests
        GENERATE_INFOPLIST_FILE: YES
