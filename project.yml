name: Holeberry
options:
  bundleIdPrefix: me.pedrovieira
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "${HOLEBERRY_TEAM_ID}"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "${HOLEBERRY_CODE_SIGN_IDENTITY}"

packages:
  HoleberryCore:
    path: Packages/HoleberryCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  SymbolPicker:
    url: https://github.com/SzpakKamil/SymbolPicker
    from: 1.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Holeberry:
    type: application
    platform: macOS
    sources:
      - path: Sources/Holeberry
    info:
      path: Sources/Holeberry/Support/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "1.0.2"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        NSLocalNetworkUsageDescription: Holeberry needs local network access to connect to your Pi-hole instances.
        NSAppleEventsUsageDescription: Holeberry needs to read the current tab URL from your browser to unblock it.
        SUEnableDownloaderService: true
        SUEnableInstallerLauncherService: true
        SUFeedURL: "https://raw.githubusercontent.com/pedrovieira/Holeberry/main/Updates/appcast.xml"
        SUPublicEDKey: "xqSTVnKmoOX+TbqHndinP0cEITTAKsrSGjnOFZO0TlM="
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/Holeberry/Support/Holeberry.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: me.pedrovieira.holeberry
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    dependencies:
      - package: HoleberryCore
      - package: KeyboardShortcuts
      - package: SymbolPicker
      - package: Sparkle
    preBuildScripts:
      - name: Run SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint > /dev/null; then
            swiftlint --strict Sources/ Packages/HoleberryCore/Sources/
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
      - name: Run swift-format lint
        basedOnDependencyAnalysis: false
        script: |
          FORMAT_BIN=$(xcrun --find swift-format 2>/dev/null)
          if [ -n "$FORMAT_BIN" ]; then
            "$FORMAT_BIN" lint --recursive --strict Sources/ Packages/HoleberryCore/Sources/
            # Use relaxed rules for test files
            "$FORMAT_BIN" lint --recursive --strict --configuration Packages/HoleberryCore/.swift-format Packages/HoleberryCore/Tests/
          else
            echo "warning: swift-format not found in Xcode toolchain"
          fi


