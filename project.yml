name: PiHoleMenuApp
options:
  bundleIdPrefix: com.pihole.menuapp
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  SimpleKeychain:
    url: https://github.com/auth0/SimpleKeychain
    from: 1.3.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0

targets:
  PiHoleMenuApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/PiHoleMenuApp
    info:
      path: Sources/PiHoleMenuApp/Info.plist
      properties:
        LSUIElement: true
        NSLocalNetworkUsageDescription: PiHoleMenuApp needs local network access to connect to your Pi-hole instances.
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/PiHoleMenuApp/Resources/PiHoleMenuApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pihole.menuapp
    dependencies:
      - package: SimpleKeychain
      - package: Defaults
      - package: KeyboardShortcuts
    preBuildScripts:
      - name: Run SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint > /dev/null; then
            swiftlint --strict
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
      - name: Run swift-format lint
        basedOnDependencyAnalysis: false
        script: |
          FORMAT_BIN=$(xcrun --find swift-format 2>/dev/null)
          if [ -n "$FORMAT_BIN" ]; then
            "$FORMAT_BIN" lint --recursive --strict Sources/ Tests/
          else
            echo "warning: swift-format not found in Xcode toolchain"
          fi

  PiHoleMenuAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PiHoleMenuAppTests
    dependencies:
      - target: PiHoleMenuApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pihole.menuapp.tests
        GENERATE_INFOPLIST_FILE: YES
