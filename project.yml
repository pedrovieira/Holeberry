name: Holeberry
options:
  bundleIdPrefix: me.pedrovieira
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    HOLEBERRY_APP_BUNDLE_IDENTIFIER: me.pedrovieira.holeberry
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1.2.0"
    DEVELOPMENT_TEAM: "${HOLEBERRY_TEAM_ID}"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "${HOLEBERRY_CODE_SIGN_IDENTITY}"
    # Historical automatic DEVELOPMENT signing selected a wildcard profile that
    # did not authorize the registered App Group. This flag makes registered-group
    # provisioning explicit for local/automatic signing. It was not verified to
    # change manual Developer ID profile selection.
    REGISTER_APP_GROUPS: YES

packages:
  HoleberryCore:
    path: Packages/HoleberryCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  SymbolPicker:
    url: https://github.com/SzpakKamil/SymbolPicker
    from: 1.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

targets:
  Holeberry:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - HoleberryWidgetsTests
    sources:
      - path: Sources/Holeberry
      # Compiled into the app target so Xcode can preview the widget view.
      # Xcode does not support previews for macOS widget extensions.
      # The HOLEBERRY_APP_TARGET flag excludes the Widget configuration there.
      - path: Sources/HoleberryWidgets/AllServersWidget.swift
      - path: Sources/HoleberryWidgets/QueryStatisticsEntry.swift
      - path: Sources/HoleberryWidgets/WidgetPresentation.swift
    info:
      path: Sources/Holeberry/Support/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        NSLocalNetworkUsageDescription: Holeberry needs local network access to connect to your Pi-hole instances.
        NSAppleEventsUsageDescription: Holeberry needs to read the current tab URL from your browser to unblock it.
        # Allow cleartext HTTP to user-entered hosts (e.g. Pi-hole over Tailscale or another VPN).
        # Do NOT add NSAllowsLocalNetworking: on macOS 10.12+ it makes ATS ignore NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        SUEnableDownloaderService: true
        SUEnableInstallerLauncherService: true
        SUFeedURL: "https://raw.githubusercontent.com/pedrovieira/Holeberry/main/Updates/appcast.xml"
        SUPublicEDKey: "xqSTVnKmoOX+TbqHndinP0cEITTAKsrSGjnOFZO0TlM="
        SUEnableAutomaticChecks: true
        SUShowReleaseNotes: false
        HoleberryAppGroupIdentifier: group.me.pedrovieira.holeberry
        HoleberryKeychainAccessGroup: "$(AppIdentifierPrefix)me.pedrovieira.holeberry.shared"
        HoleberryContainingAppIdentifier: "$(HOLEBERRY_APP_BUNDLE_IDENTIFIER)"
        CFBundleURLTypes:
          - CFBundleURLName: me.pedrovieira.holeberry
            CFBundleURLSchemes:
              - holeberry
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/Holeberry/Support/Holeberry.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: "$(HOLEBERRY_APP_BUNDLE_IDENTIFIER)"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOLEBERRY_APP_TARGET"
        PROVISIONING_PROFILE_SPECIFIER: "$(HOLEBERRY_APP_PROVISIONING_PROFILE_SPECIFIER)"
    dependencies:
      - package: HoleberryCore
      - package: KeyboardShortcuts
      - package: SymbolPicker
      - package: Sparkle
      - target: HoleberryWidgets
    preBuildScripts:
      - name: Run SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint > /dev/null; then
            swiftlint --strict Sources/ Packages/HoleberryCore/Sources/
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
      - name: Run swift-format lint
        basedOnDependencyAnalysis: false
        script: |
          FORMAT_BIN=$(xcrun --find swift-format 2>/dev/null)
          if [ -n "$FORMAT_BIN" ]; then
            "$FORMAT_BIN" lint --recursive --strict Sources/ Packages/HoleberryCore/Sources/
            # Use relaxed rules for test files
            "$FORMAT_BIN" lint --recursive --strict --configuration Packages/HoleberryCore/.swift-format Packages/HoleberryCore/Tests/
          else
            echo "warning: swift-format not found in Xcode toolchain"
          fi

  HoleberryWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/HoleberryWidgets
      - path: Sources/Holeberry/Resources/Assets.xcassets
    info:
      path: Sources/HoleberryWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Holeberry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Allow cleartext HTTP to user-entered hosts (e.g. Pi-hole over Tailscale or another VPN).
        # Do NOT add NSAllowsLocalNetworking: on macOS 10.12+ it makes ATS ignore NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        HoleberryAppGroupIdentifier: group.me.pedrovieira.holeberry
        HoleberryKeychainAccessGroup: "$(AppIdentifierPrefix)me.pedrovieira.holeberry.shared"
        HoleberryContainingAppIdentifier: "$(HOLEBERRY_APP_BUNDLE_IDENTIFIER)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.pedrovieira.holeberry.widgets
        CODE_SIGN_ENTITLEMENTS: Sources/HoleberryWidgets/Support/HoleberryWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        PROVISIONING_PROFILE_SPECIFIER: "$(HOLEBERRY_WIDGET_PROVISIONING_PROFILE_SPECIFIER)"
    dependencies:
      - package: HoleberryCore

  HoleberryWidgetsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HoleberryWidgetsTests
      # Test the same presentation source without hosting the widget extension.
      - path: Sources/HoleberryWidgets/WidgetPresentation.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    dependencies:
      - package: HoleberryCore
