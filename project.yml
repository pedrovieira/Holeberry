name: PiHoleMenuApp
options:
  bundleIdPrefix: com.pihole.menuapp
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  PiHoleMenuApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/PiHoleMenuApp
    settings:
      base:
        INFOPLIST_FILE: Sources/PiHoleMenuApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PiHoleMenuApp/Resources/PiHoleMenuApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pihole.menuapp
    dependencies: []

  PiHoleMenuAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PiHoleMenuAppTests
    dependencies:
      - target: PiHoleMenuApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pihole.menuapp.tests
