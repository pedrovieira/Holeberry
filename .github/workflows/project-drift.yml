name: Project Drift

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: macos-latest

    # xcodegen resolves these env vars into project.pbxproj at generation
    # time; the committed project is generated with them set, so the drift
    # check must use the same values (see project.yml).
    env:
      HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID }}
      HOLEBERRY_CODE_SIGN_IDENTITY: ${{ secrets.HOLEBERRY_CODE_SIGN_IDENTITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- Holeberry.xcodeproj Sources/Holeberry/Support/Info.plist
