name: Project Drift

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: macos-latest

    # xcodegen resolves these env vars into project.pbxproj at generation
    # time; the committed project is generated with the local development
    # values (see project.yml), so the drift check must use the same values.
    # Releases are unaffected: release.yml regenerates the project itself
    # with the Developer ID signing identity for notarized distribution.
    env:
      HOLEBERRY_TEAM_ID: 5UN5GTF749
      HOLEBERRY_CODE_SIGN_IDENTITY: "Apple Development"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- Holeberry.xcodeproj Sources/Holeberry/Support/Info.plist
