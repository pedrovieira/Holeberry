name: Project Drift

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: macos-latest

    # xcodegen resolves these env vars into project.pbxproj at generation
    # time; the committed project is generated with them set, so the drift
    # check must use the same values (see project.yml).
    #
    # Fork PRs receive no secrets, so fall back to the exact values the
    # committed project was generated with; this keeps the check deterministic
    # (and passable) for external contributors while remaining identical to
    # the secret-backed run on same-repo pushes.
    env:
      HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID || '5UN5GTF749' }}
      # Quoted: the fallback contains ": " which is invalid YAML in a plain scalar
      HOLEBERRY_CODE_SIGN_IDENTITY: "${{ secrets.HOLEBERRY_CODE_SIGN_IDENTITY || 'Developer ID Application: Pedro Vieira (5UN5GTF749)' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- Holeberry.xcodeproj Sources/Holeberry/Support/Info.plist
