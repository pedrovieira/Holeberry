name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # Global (not per-tag): two releases in flight would otherwise race to push
  # appcast.xml to main, and the second push would be rejected as
  # non-fast-forward.
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- build ---
  # Produces the signed/notarized DMG and the appcast; the only externally
  # visible result is a DRAFT release (write-access only). Nothing touches
  # main and no update is offered to Sparkle clients before the gated
  # `publish` job below runs.
  build:
    # macOS 27 SDK is required to compile Sources/Holeberry
    # (NSMenuItem+ImageVisibility uses preferredImageVisibility), and
    # macos-latest still ships Xcode 26.6. GitHub's xcode-27 preview image has
    # Xcode 27 as its default /Applications/Xcode.app:
    # https://github.com/actions/runner-images/issues/14404 — switch back to
    # macos-latest once the macOS 27 image reaches GA.
    runs-on: xcode-27
    outputs:
      dmg_sha256: ${{ steps.dmg_notarized.outputs.dmg_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the appcast step resets local main from origin/main.
          fetch-depth: 0
          # Don't persist the GITHUB_TOKEN as an http.extraheader in .git/config;
          # nothing in this workflow pushes with the token (the appcast push
          # uses RELEASE_PAT via an inline URL).
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Parse Sparkle version from Package.resolved
        id: sparkle-version
        run: |
          SPARKLE_VERSION=$(python3 -c "
          import json
          with open('Holeberry.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') as f:
              data = json.load(f)
          for pin in data.get('pins', data.get('object', {}).get('pins', [])):
              if pin.get('package', pin.get('identity', '')).lower() == 'sparkle':
                  print(pin.get('state', {}).get('version', pin.get('state', {}).get('branch', '')))
                  break
          ")
          echo "version=$SPARKLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          HOLEBERRY_CERT_P12: ${{ secrets.HOLEBERRY_CERT_P12 }}
          HOLEBERRY_CERT_P12_PASSWORD: ${{ secrets.HOLEBERRY_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail closed: a release without a signing certificate must never be
          # published (an unnotarized build would be pushed to Sparkle users
          # as make_latest). Tag pushes always have repo secrets available.
          if [ -z "$HOLEBERRY_CERT_P12" ]; then
            echo "::error::HOLEBERRY_CERT_P12 secret is not set — cannot produce a signed build; refusing to release"
            exit 1
          fi
          KEYCHAIN=build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$HOLEBERRY_CERT_P12" | base64 --decode > /tmp/holeberry-cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/holeberry-cert.p12 \
            -P "$HOLEBERRY_CERT_P12_PASSWORD" \
            -A -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/holeberry-cert.p12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Fail fast: a certificate-only p12 imports fine but leaves no signing
          # identity — the release would otherwise die later with a cryptic
          # SecItemCopyMatching error at the first codesign.
          if security find-identity -v -p codesigning "$KEYCHAIN" 2>/dev/null | grep -q "0 valid identities"; then
            echo "::error::HOLEBERRY_CERT_P12 contains no private key — re-export the p12 from Keychain Access (My Certificates) with the private key included"
            exit 1
          fi
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "::notice::Signing certificate imported into $KEYCHAIN"

      - name: Install Developer ID provisioning profiles
        id: profiles
        env:
          HOLEBERRY_APP_PROFILE: ${{ secrets.HOLEBERRY_APP_PROFILE }}
          HOLEBERRY_WIDGET_PROFILE: ${{ secrets.HOLEBERRY_WIDGET_PROFILE }}
          HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${HOLEBERRY_APP_PROFILE:-}" ] || [ -z "${HOLEBERRY_WIDGET_PROFILE:-}" ]; then
            echo "::error::HOLEBERRY_APP_PROFILE and HOLEBERRY_WIDGET_PROFILE secrets are not set — cannot sign the app and widget; refusing to release"
            exit 1
          fi
          if [ -z "${HOLEBERRY_TEAM_ID:-}" ]; then
            echo "::error::HOLEBERRY_TEAM_ID secret is not set — cannot select profiles; refusing to release"
            exit 1
          fi

          INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MANIFEST="$RUNNER_TEMP/holeberry-installed-profiles.txt"
          PROFILE_TEMP_DIR="$(mktemp -d "$RUNNER_TEMP/holeberry-profiles.XXXXXX")"
          chmod 700 "$PROFILE_TEMP_DIR"
          trap 'rm -rf "$PROFILE_TEMP_DIR"' EXIT
          UUID_PATTERN='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          PROFILE_UUID=""

          mkdir -p "$INSTALL_DIR"
          : > "$MANIFEST"

          install_profile() {
            local encoded="$1"
            local label="$2"
            local temp_profile="$PROFILE_TEMP_DIR/$label.provisionprofile"
            local temp_plist="$PROFILE_TEMP_DIR/$label.plist"
            local installed

            printf '%s' "$encoded" | base64 --decode > "$temp_profile"
            chmod 600 "$temp_profile"
            security cms -D -i "$temp_profile" > "$temp_plist"
            if ! PROFILE_UUID="$(python3 - "$temp_plist" "$label" "$HOLEBERRY_TEAM_ID" <<'PY'
          import datetime
          import plistlib
          import sys

          path, role, team = sys.argv[1:4]
          bundle_ids = {
              "app": "me.pedrovieira.holeberry",
              "widget": "me.pedrovieira.holeberry.widgets",
          }
          app_group = "group.me.pedrovieira.holeberry"
          keychain_group = f"{team}.me.pedrovieira.holeberry.shared"


          def fail(message):
              print(f"::error::{role} profile: {message}", file=sys.stderr)
              raise SystemExit(1)


          def authorized(value, patterns):
              return isinstance(patterns, list) and any(
                  isinstance(pattern, str)
                  and (
                      pattern == "*"
                      or pattern == value
                      or (pattern.endswith("*") and value.startswith(pattern[:-1]))
                  )
                  for pattern in patterns
              )


          try:
              with open(path, "rb") as handle:
                  profile = plistlib.load(handle)
          except Exception:
              fail("profile is not a decodable plist")

          uuid = profile.get("UUID")
          if not isinstance(uuid, str):
              fail("profile UUID is missing")

          entitlements = profile.get("Entitlements")
          if not isinstance(entitlements, dict):
              fail("profile Entitlements are missing")

          bundle_id = bundle_ids.get(role)
          if bundle_id is None:
              fail("unknown target role")

          if entitlements.get("com.apple.application-identifier") != f"{team}.{bundle_id}":
              fail("application identifier does not match the target")
          if not authorized(app_group, entitlements.get("com.apple.security.application-groups")):
              fail("registered App Group is not authorized")
          if not authorized(keychain_group, entitlements.get("keychain-access-groups")):
              fail("shared Keychain group is not authorized")

          expiration = profile.get("ExpirationDate")
          if not isinstance(expiration, datetime.datetime):
              fail("ExpirationDate is missing")
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if expiration <= datetime.datetime.now(datetime.timezone.utc):
              fail("profile is expired")

          print(uuid)
          PY
            )"; then
              echo "::error::$label profile failed the authorization preflight checks"
              return 1
            fi
            if [[ ! "$PROFILE_UUID" =~ $UUID_PATTERN ]]; then
              echo "::error::$label profile has a missing or unsafe UUID"
              return 1
            fi

            installed="$INSTALL_DIR/$PROFILE_UUID.provisionprofile"
            if [ -e "$installed" ]; then
              if ! cmp -s "$temp_profile" "$installed"; then
                echo "::error::$label profile UUID $PROFILE_UUID already exists with different contents; refusing to overwrite"
                return 1
              fi
              echo "::notice::$label profile $PROFILE_UUID is already installed with identical contents; reusing it"
            else
              cp "$temp_profile" "$installed"
              printf '%s\n' "$installed" >> "$MANIFEST"
              chmod 600 "$installed"
              echo "::notice::Installed $label profile $PROFILE_UUID"
            fi
          }

          install_profile "$HOLEBERRY_APP_PROFILE" "app"
          APP_UUID="$PROFILE_UUID"
          install_profile "$HOLEBERRY_WIDGET_PROFILE" "widget"
          WIDGET_UUID="$PROFILE_UUID"

          echo "app_uuid=$APP_UUID" >> "$GITHUB_OUTPUT"
          echo "widget_uuid=$WIDGET_UUID" >> "$GITHUB_OUTPUT"
          echo "::notice::Using app profile $APP_UUID and widget profile $WIDGET_UUID"

      - name: Prepare notarization credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # Fail closed: without notarization the release must not be published.
          if [ -z "$APPLE_API_KEY" ]; then
            echo "::error::APPLE_API_KEY secret is not set — cannot notarize; refusing to release"
            exit 1
          fi
          # App Store Connect API key (.p8), base64-encoded in the secret.
          echo "$APPLE_API_KEY" | base64 --decode > /tmp/holeberry-apple-api-key.p8
          echo "::notice::App Store Connect API key written"

      - name: Build Holeberry
        env:
          HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID }}
          HOLEBERRY_CODE_SIGN_IDENTITY: ${{ secrets.HOLEBERRY_CODE_SIGN_IDENTITY }}
          HOLEBERRY_APP_PROVISIONING_PROFILE_SPECIFIER: ${{ steps.profiles.outputs.app_uuid }}
          HOLEBERRY_WIDGET_PROVISIONING_PROFILE_SPECIFIER: ${{ steps.profiles.outputs.widget_uuid }}
        run: |
          set -euo pipefail
          xcodegen generate

          # Developer ID signing with the certificate imported above — required
          # for notarized distribution outside the Mac App Store. Each target
          # selects its own profile UUID; a single global profile would conflict
          # with the embedded widget extension.
          #
          # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO: Xcode 26 injects the
          # restricted com.apple.security.get-task-allow entitlement into
          # Release builds (even with a Developer ID identity) whenever
          # base-entitlement injection is on and no provisioning profile is
          # in play. The notary service rejects restricted entitlements, so
          # we disable the injection — our own entitlements file is all the
          # app needs.
          echo "::notice::Signing with identity $HOLEBERRY_CODE_SIGN_IDENTITY"
          xcodebuild -project Holeberry.xcodeproj \
            -scheme Holeberry \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM="$HOLEBERRY_TEAM_ID" \
            CODE_SIGN_IDENTITY="$HOLEBERRY_CODE_SIGN_IDENTITY" \
            HOLEBERRY_APP_PROVISIONING_PROFILE_SPECIFIER="$HOLEBERRY_APP_PROVISIONING_PROFILE_SPECIFIER" \
            HOLEBERRY_WIDGET_PROVISIONING_PROFILE_SPECIFIER="$HOLEBERRY_WIDGET_PROVISIONING_PROFILE_SPECIFIER"

      - name: Re-sign nested Sparkle code
        env:
          HOLEBERRY_CODE_SIGN_IDENTITY: ${{ secrets.HOLEBERRY_CODE_SIGN_IDENTITY }}
          HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/Holeberry.app"
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/Current"
          # Sparkle's XCFramework ships its XPC services and helper binaries
          # ad-hoc signed; Xcode re-signs the framework but not its contents.
          # The notary service rejects ad-hoc nested code, so re-sign
          # inside-out with the Developer ID identity, preserving each item's
          # own entitlements.
          for item in \
            "$SPARKLE_FW/XPCServices/Downloader.xpc" \
            "$SPARKLE_FW/XPCServices/Installer.xpc" \
            "$SPARKLE_FW/Updater.app" \
            "$SPARKLE_FW/Autoupdate"; do
            codesign --force --options runtime --preserve-metadata=entitlements,identifier \
              --sign "$HOLEBERRY_CODE_SIGN_IDENTITY" "$item"
          done
          codesign --force --options runtime --preserve-metadata=entitlements,identifier \
            --sign "$HOLEBERRY_CODE_SIGN_IDENTITY" "$SPARKLE_FW"
          codesign --force --options runtime --preserve-metadata=entitlements,identifier \
            --sign "$HOLEBERRY_CODE_SIGN_IDENTITY" "$APP_PATH"
          # Audit: every Mach-O in the bundle must carry our team ID
          find "$APP_PATH" -type f -exec file {} \; | grep "Mach-O" | grep -v "for architecture" | cut -d: -f1 | while read -r f; do
            # Plain grep (not grep -q): grep -q exits early and SIGPIPEs
            # codesign, which pipefail then reports as a false failure.
            if ! codesign -dv "$f" 2>&1 | grep "TeamIdentifier=$HOLEBERRY_TEAM_ID" >/dev/null; then
              echo "::error::$f is not signed with team $HOLEBERRY_TEAM_ID"
              exit 1
            fi
          done
          echo "::notice::Nested Sparkle code re-signed and audited"

      - name: Assert signed app/widget metadata and entitlements
        env:
          HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - "build/Build/Products/Release/Holeberry.app" "$HOLEBERRY_TEAM_ID" <<'PY'
          import datetime
          import plistlib
          import subprocess
          import sys
          from pathlib import Path

          app_path = Path(sys.argv[1])
          team = sys.argv[2]
          widget_path = app_path / "Contents/PlugIns/HoleberryWidgets.appex"
          app_group = "group.me.pedrovieira.holeberry"
          keychain_group = f"{team}.me.pedrovieira.holeberry.shared"
          roles = {
              "app": (app_path, "me.pedrovieira.holeberry"),
              "widget": (widget_path, "me.pedrovieira.holeberry.widgets"),
          }


          def fail(role, message):
              print(f"::error::{role}: {message}", file=sys.stderr)
              raise SystemExit(1)


          def authorized(value, patterns):
              return isinstance(patterns, list) and any(
                  isinstance(pattern, str)
                  and (
                      pattern == "*"
                      or pattern == value
                      or (pattern.endswith("*") and value.startswith(pattern[:-1]))
                  )
                  for pattern in patterns
              )


          def load_plist_command(command, role, label):
              result = subprocess.run(command, capture_output=True)
              if result.returncode != 0:
                  fail(role, f"cannot read {label}")
              try:
                  value = plistlib.loads(result.stdout)
              except Exception:
                  fail(role, f"{label} is not a valid plist")
              if not isinstance(value, dict):
                  fail(role, f"{label} is not a dictionary")
              return value


          versions = {}
          for role, (bundle_path, bundle_id) in roles.items():
              profile_path = bundle_path / "Contents/embedded.provisionprofile"
              if not profile_path.is_file():
                  fail(role, "embedded provisioning profile is missing")
              profile = load_plist_command(
                  ["security", "cms", "-D", "-i", str(profile_path)],
                  role,
                  "embedded profile",
              )
              profile_entitlements = profile.get("Entitlements")
              if not isinstance(profile_entitlements, dict):
                  fail(role, "profile Entitlements are missing")
              expected_app_id = f"{team}.{bundle_id}"
              profile_teams = profile.get("TeamIdentifier")
              if not isinstance(profile_teams, list) or team not in profile_teams:
                  fail(role, "profile team does not match")
              if profile_entitlements.get("com.apple.application-identifier") != expected_app_id:
                  fail(role, "profile application identifier does not match")
              if not authorized(
                  app_group,
                  profile_entitlements.get("com.apple.security.application-groups"),
              ):
                  fail(role, "profile does not authorize the registered App Group")
              if not authorized(
                  keychain_group,
                  profile_entitlements.get("keychain-access-groups"),
              ):
                  fail(role, "profile does not authorize the shared Keychain group")
              expiration = profile.get("ExpirationDate")
              if not isinstance(expiration, datetime.datetime):
                  fail(role, "profile expiration date is missing")
              if expiration.tzinfo is None:
                  expiration = expiration.replace(tzinfo=datetime.timezone.utc)
              if expiration <= datetime.datetime.now(datetime.timezone.utc):
                  fail(role, "profile is expired")

              actual = load_plist_command(
                  [
                      "codesign",
                      "-d",
                      "--entitlements",
                      "-",
                      "--xml",
                      str(bundle_path),
                  ],
                  role,
                  "signed entitlements",
              )
              if actual.get("com.apple.application-identifier") != expected_app_id:
                  fail(role, "signed application identifier does not match")
              if app_group not in actual.get("com.apple.security.application-groups", []):
                  fail(role, "signed App Group is missing")
              if keychain_group not in actual.get("keychain-access-groups", []):
                  fail(role, "signed concrete Keychain group is missing")
              for key in ("get-task-allow", "com.apple.security.get-task-allow"):
                  if key in actual:
                      fail(role, "signed entitlements contain a debug entitlement")
              if role == "widget":
                  if actual.get("com.apple.security.app-sandbox") is not True:
                      fail(role, "widget sandbox entitlement is missing")
                  if actual.get("com.apple.security.network.client") is not True:
                      fail(role, "widget network entitlement is missing")

              info_path = bundle_path / "Contents/Info.plist"
              try:
                  with open(info_path, "rb") as handle:
                      info = plistlib.load(handle)
              except Exception:
                  fail(role, "built Info.plist is not readable")
              if info.get("CFBundleIdentifier") != bundle_id:
                  fail(role, "built bundle identifier does not match")
              if info.get("HoleberryAppGroupIdentifier") != app_group:
                  fail(role, "built App Group marker is incorrect")
              if info.get("HoleberryKeychainAccessGroup") != keychain_group:
                  fail(role, "built Keychain marker is not the expected concrete team-prefixed value")
              marketing = info.get("CFBundleShortVersionString")
              build = info.get("CFBundleVersion")
              if (
                  not isinstance(marketing, str)
                  or not marketing
                  or not isinstance(build, str)
                  or not build
              ):
                  fail(role, "built version metadata is missing")
              versions[role] = (marketing, build)

          if versions["app"] != versions["widget"]:
              print("::error::app and widget built versions do not match", file=sys.stderr)
              raise SystemExit(1)
          print(
              f"::notice::Signed app/widget metadata valid "
              f"(version {versions['app'][0]} build {versions['app'][1]})"
          )
          PY

      - name: Verify release tag matches app version
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/Holeberry.app"
          APP_INFO="$APP_PATH/Contents/Info.plist"
          WIDGET_INFO="$APP_PATH/Contents/PlugIns/HoleberryWidgets.appex/Contents/Info.plist"
          APP_MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_INFO")
          APP_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO")
          WIDGET_MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WIDGET_INFO")
          WIDGET_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WIDGET_INFO")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_MARKETING_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app marketing version $APP_MARKETING_VERSION — bump MARKETING_VERSION in project.yml before tagging"
            exit 1
          fi
          if [ "$WIDGET_MARKETING_VERSION" != "$APP_MARKETING_VERSION" ]; then
            echo "::error::Widget marketing version $WIDGET_MARKETING_VERSION does not match app marketing version $APP_MARKETING_VERSION"
            exit 1
          fi
          if [ "$WIDGET_BUILD_VERSION" != "$APP_BUILD_VERSION" ]; then
            echo "::error::Widget build version $WIDGET_BUILD_VERSION does not match app build version $APP_BUILD_VERSION"
            exit 1
          fi
          echo "::notice::Tag, app, and widget versions match (marketing $APP_MARKETING_VERSION, build $APP_BUILD_VERSION)"

      - name: Notarize app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/Holeberry.app"
          # Fail fast on a bad signature before spending minutes in the notary queue
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # notarytool requires a container format (.zip/.pkg/.dmg) and rejects a
          # bare .app; zip the app, then staple the ticket onto the bundle itself.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" /tmp/holeberry-app.zip
          # notarytool exits 0 even when Apple's verdict is "Invalid", so check
          # the status ourselves and print Apple's log on rejection.
          SUBMIT_OUTPUT="$(xcrun notarytool submit /tmp/holeberry-app.zip \
            --key /tmp/holeberry-apple-api-key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 30m 2>&1 || true)"
          echo "$SUBMIT_OUTPUT"
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            SUBMISSION_ID="$(echo "$SUBMIT_OUTPUT" | sed -n 's/.*id: \([0-9a-f-]\{36\}\).*/\1/p' | head -1)"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "::error::Notarization rejected — Apple's log:"
              xcrun notarytool log "$SUBMISSION_ID" \
                --key /tmp/holeberry-apple-api-key.p8 \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi
          # Staple before packaging so the ticket is embedded in the DMG
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Create DMG
        id: dmg
        run: |
          APP_PATH="build/Build/Products/Release/Holeberry.app"
          DMG_NAME="Holeberry-${GITHUB_REF_NAME#v}.dmg"
          DMG_PATH="build/$DMG_NAME"

          mkdir -p build/dmg
          cp -R "$APP_PATH" build/dmg/
          ln -s /Applications build/dmg/Applications

          hdiutil create -volname "Holeberry" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG
        id: dmg_notarized
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          SUBMIT_OUTPUT="$(xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --key /tmp/holeberry-apple-api-key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 30m 2>&1 || true)"
          echo "$SUBMIT_OUTPUT"
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            SUBMISSION_ID="$(echo "$SUBMIT_OUTPUT" | sed -n 's/.*id: \([0-9a-f-]\{36\}\).*/\1/p' | head -1)"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "::error::DMG notarization rejected — Apple's log:"
              xcrun notarytool log "$SUBMISSION_ID" \
                --key /tmp/holeberry-apple-api-key.p8 \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi
          xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}"
          xcrun stapler validate "${{ steps.dmg.outputs.dmg_path }}"
          # Stapling modifies the DMG, so the checksum (and the appcast
          # edSignature over it) is computed only now, after the ticket lands.
          DMG_SHA256=$(shasum -a 256 "${{ steps.dmg.outputs.dmg_path }}" | cut -d' ' -f1)
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "::notice::DMG sha256: $DMG_SHA256"

      - name: Clone Sparkle (matching pinned version)
        run: |
          set -euo pipefail
          VERSION="${{ steps.sparkle-version.outputs.version }}"
          REPO="https://github.com/sparkle-project/Sparkle"

          SPARKLE_TAG=""
          for candidate in "$VERSION" "v$VERSION"; do
            if git ls-remote --exit-code --tags "$REPO" "refs/tags/$candidate" >/dev/null 2>&1; then
              SPARKLE_TAG="$candidate"
              break
            fi
          done

          if [[ -z "$SPARKLE_TAG" ]]; then
            echo "::error::Could not find Sparkle tag for version $VERSION"
            exit 1
          fi

          git clone --depth 1 --branch "$SPARKLE_TAG" --single-branch "$REPO" /tmp/sparkle-src
          echo "sparkle_tag=$SPARKLE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build generate_appcast
        run: |
          xcodebuild -project /tmp/sparkle-src/Sparkle.xcodeproj \
            -scheme generate_appcast \
            -configuration Release \
            -derivedDataPath /tmp/sparkle-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Switch to latest main
        run: |
          set -euo pipefail
          # The tag checkout is detached at the tag commit; base the merge on real main.
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate signed appcast
        env:
          PRIVATE_SPARKLE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p Updates
          cp "${{ steps.dmg.outputs.dmg_path }}" Updates/

          # Merges into the existing feed at -o: older entries are kept,
          # same-version entries are replaced.
          printf '%s' "$PRIVATE_SPARKLE_KEY" | \
            /tmp/sparkle-derived/Build/Products/Release/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
              -o Updates/appcast.xml \
              Updates/

      # Review surface: the exact appcast that will ship, before approving.
      - name: Preview appcast diff
        run: |
          set -euo pipefail
          {
            echo "### Appcast diff for ${{ github.ref_name }}"
            echo
            echo '```diff'
            # Intent-to-add so a (hypothetically) untracked file still diffs.
            git add -N Updates/appcast.xml 2>/dev/null || true
            git diff -- Updates/appcast.xml || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Draft only: nothing is public until the gated `publish` job flips it.
      # draft: true must stay UNCONDITIONAL — softprops/action-gh-release
      # publishes an existing draft when the input is omitted on a re-run
      # (see its README: "omit it to publish after upload").
      # make_latest is intentionally absent: drafts cannot be set as latest.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.dmg.outputs.dmg_path }}
          # GitHub generates notes server-side (PRs + contributors); no local
          # tag math, so it survives rewritten tags.
          generate_release_notes: true
          draft: true

      # Pre-publish gate: prove the asset users will eventually download is
      # byte-identical (and still stapled) before publish approval is even
      # possible. Runs against the draft, which is write-access-only.
      - name: Verify draft DMG asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG_NAME="${{ steps.dmg.outputs.dmg_name }}"
          TMP_DIR="/tmp/draft-verify"
          mkdir -p "$TMP_DIR"
          # gh release download resolves draft releases; the raw
          # releases/tags/{tag} REST endpoint 404s until the release is
          # published, and gh api cannot fetch browser download URLs.
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "$DMG_NAME" \
            --dir "$TMP_DIR" --clobber
          ACTUAL=$(shasum -a 256 "$TMP_DIR/$DMG_NAME" | cut -d' ' -f1)
          EXPECTED="${{ steps.dmg_notarized.outputs.dmg_sha256 }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Draft asset checksum mismatch: got $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          xcrun stapler validate "$TMP_DIR/$DMG_NAME"
          echo "::notice::Draft DMG verified (sha256 $ACTUAL)"

      # appcast.xml is public-at-publish content, so a short-lived artifact is
      # fine; the DMG itself stays only in the draft (workflow artifacts on a
      # public repo are downloadable by any signed-in user).
      - name: Upload appcast artifact
        uses: actions/upload-artifact@v7
        with:
          name: appcast
          path: Updates/appcast.xml
          retention-days: 5

      # Tear down signing material even when an earlier step failed (the runner
      # is ephemeral, but never leave the decoded private key behind).
      - name: Clean up signing credentials
        if: always()
        run: |
          # Keep going even if an individual cleanup fails so the certificate,
          # API key, keychain, and profile files are all attempted, then report
          # the last captured failure status.
          set -uo pipefail
          STATUS=0
          INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MANIFEST="$RUNNER_TEMP/holeberry-installed-profiles.txt"
          if [ -f "$MANIFEST" ]; then
            while IFS= read -r profile; do
              [ -n "$profile" ] || continue
              case "$profile" in
                "$INSTALL_DIR"/*)
                  rm -f "$profile" || STATUS=$?
                  ;;
                *)
                  echo "::error::refusing to remove a profile outside the install directory: $profile"
                  STATUS=1
                  ;;
              esac
            done < "$MANIFEST"
            rm -f "$MANIFEST" || STATUS=$?
          fi
          rm -rf "$RUNNER_TEMP"/holeberry-profiles.* || STATUS=$?
          rm -f /tmp/holeberry-cert.p12 /tmp/holeberry-apple-api-key.p8 /tmp/holeberry-app.zip || STATUS=$?
          security delete-keychain build.keychain-db 2>/dev/null || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Signing material cleanup failed (exit $STATUS) after attempting to remove the certificate, API key, and keychain"
            exit "$STATUS"
          fi
          echo "::notice::Signing material cleaned up"

  # ------------------------------------------------------------- publish ---
  # Point of no return. Gated on the `release` environment's required
  # reviewers: the appcast the build job generated (and you reviewed in the
  # step summary) is committed to main, attached to the release, and only
  # then is the draft published as latest.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Download appcast artifact
        uses: actions/download-artifact@v8
        with:
          name: appcast
          path: Updates

      - name: Guard against non-tag triggers
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::publish must only run from a v* tag push (got ${GITHUB_REF_NAME})"
            exit 1
          fi

      # Commit the appcast to main with the owner PAT (RELEASE_PAT): the branch
      # ruleset only allows pushes from the owner, so the Actions bot cannot
      # push. It is also attached to the release below so that existing
      # installs (whose Info.plist points at the /releases/latest/download URL)
      # keep receiving update checks during the transition to the raw URL.
      - name: Commit appcast to main
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT secret is not set; cannot commit appcast to main"
            exit 1
          fi

          git config user.name "Holeberry Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Updates/appcast.xml
          if ! git diff --cached --quiet; then
            # [skip ci] avoids re-running ci.yml/project-drift.yml on main.
            # The PAT is passed in the push URL only, so it never lands in
            # .git/config; GitHub masks it in logs, and the repo is public so
            # reads need no auth.
            git commit -m "Update appcast for ${{ github.ref_name }} [skip ci]"
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git" main
          else
            echo "::notice::appcast.xml unchanged, nothing to commit"
          fi

      - name: Attach appcast and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" Updates/appcast.xml --clobber
          gh release edit "${{ github.ref_name }}" --draft=false --latest

  # --------------------------------------------------------------- verify ---
  # Post-publish audit: proves what users actually download/poll matches what
  # was built and reviewed. It cannot stop a bad release (publish already ran),
  # so treat it as detection + audit trail — recovery is manual (draft-stage
  # problems are re-tagged freely; published problems mean a version bump).
  verify:
    needs: [build, publish]
    runs-on: xcode-27
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download appcast artifact
        uses: actions/download-artifact@v8
        with:
          name: appcast
          path: Updates

      - name: Download published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/published
          mkdir -p /tmp/published
          gh release download "${{ github.ref_name }}" --pattern 'Holeberry-*.dmg' --dir /tmp/published --clobber

      - name: Verify published DMG
        run: |
          set -euo pipefail
          PUBLISHED_DMG=$(ls /tmp/published/Holeberry-*.dmg)
          ACTUAL=$(shasum -a 256 "$PUBLISHED_DMG" | cut -d' ' -f1)
          EXPECTED="${{ needs.build.outputs.dmg_sha256 }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Published DMG checksum mismatch: got $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          xcrun stapler validate "$PUBLISHED_DMG"
          echo "::notice::Published DMG verified (sha256 $ACTUAL)"

      - name: Verify appcast on main and as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What Sparkle clients actually poll (raw main) must be byte-identical
          # to the generated, reviewed appcast.
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/Updates/appcast.xml" -o /tmp/remote-appcast.xml
          if ! diff -u Updates/appcast.xml /tmp/remote-appcast.xml >/dev/null; then
            echo "::error::appcast.xml on main differs from the generated one"
            exit 1
          fi
          # Legacy feed URL (/releases/latest/download) fallback asset.
          rm -rf /tmp/release-assets
          mkdir -p /tmp/release-assets
          gh release download "${{ github.ref_name }}" --pattern appcast.xml --dir /tmp/release-assets --clobber
          if ! diff -u Updates/appcast.xml /tmp/release-assets/appcast.xml >/dev/null; then
            echo "::error::appcast.xml release asset differs from the generated one"
            exit 1
          fi
          # The release must truly be published (not left in draft).
          gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq \
            'if .draft then error("release is still a draft") else "published" end'
          echo "::notice::appcast verified on main and as release asset; release is published"
