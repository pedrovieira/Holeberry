name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the changelog step can diff between tags
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Parse Sparkle version from Package.resolved
        id: sparkle-version
        run: |
          SPARKLE_VERSION=$(python3 -c "
          import json
          with open('Holeberry.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') as f:
              data = json.load(f)
          for pin in data.get('pins', data.get('object', {}).get('pins', [])):
              if pin.get('package', pin.get('identity', '')).lower() == 'sparkle':
                  print(pin.get('state', {}).get('version', pin.get('state', {}).get('branch', '')))
                  break
          ")
          echo "version=$SPARKLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          HOLEBERRY_CERT_P12: ${{ secrets.HOLEBERRY_CERT_P12 }}
          HOLEBERRY_CERT_P12_PASSWORD: ${{ secrets.HOLEBERRY_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$HOLEBERRY_CERT_P12" ]; then
            echo "::notice::No signing certificate secret configured; release will be ad-hoc signed"
            exit 0
          fi
          KEYCHAIN=build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$HOLEBERRY_CERT_P12" | base64 --decode > /tmp/holeberry-cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/holeberry-cert.p12 \
            -P "$HOLEBERRY_CERT_P12_PASSWORD" \
            -A -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "::notice::Signing certificate imported into $KEYCHAIN"

      - name: Build Holeberry
        env:
          HOLEBERRY_TEAM_ID: ${{ secrets.HOLEBERRY_TEAM_ID }}
          HOLEBERRY_CODE_SIGN_IDENTITY: ${{ secrets.HOLEBERRY_CODE_SIGN_IDENTITY }}
          HOLEBERRY_CERT_P12: ${{ secrets.HOLEBERRY_CERT_P12 }}
        run: |
          set -euo pipefail
          xcodegen generate
          APP_PATH="build/Build/Products/Release/Holeberry.app"

          if [ -n "$HOLEBERRY_CERT_P12" ]; then
            # Real signing with the certificate imported above (Apple Development
            # or Developer ID). Restricted entitlements are fine here.
            echo "::notice::Signing with identity $HOLEBERRY_CODE_SIGN_IDENTITY"
            xcodebuild -project Holeberry.xcodeproj \
              -scheme Holeberry \
              -configuration Release \
              -derivedDataPath build \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              DEVELOPMENT_TEAM="$HOLEBERRY_TEAM_ID" \
              CODE_SIGN_IDENTITY="$HOLEBERRY_CODE_SIGN_IDENTITY"
          else
            # Ad-hoc signing. Xcode injects com.apple.security.get-task-allow
            # when no team is set; it is a restricted entitlement that makes the
            # kernel reject ad-hoc-signed binaries on Apple Silicon. Also, newer
            # Xcode versions (26+) refuse to build with the full entitlements
            # file when no provisioning profile is available. So we build
            # without entitlements, then strip the restricted one and re-sign
            # (see .github/scripts/strip-restricted-entitlements.py).
            echo "::notice::No signing certificate secret; building ad-hoc with stripped entitlements"
            xcodebuild -project Holeberry.xcodeproj \
              -scheme Holeberry \
              -configuration Release \
              -derivedDataPath build \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              DEVELOPMENT_TEAM="" \
              CODE_SIGN_ENTITLEMENTS="" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES
            codesign -d --entitlements - --xml "$APP_PATH" > /tmp/release-ents.xml
            python3 .github/scripts/strip-restricted-entitlements.py \
              /tmp/release-ents.xml /tmp/release-ents-min.xml
            codesign --force --deep --sign - --entitlements /tmp/release-ents-min.xml "$APP_PATH"
          fi

      - name: Create DMG
        id: dmg
        run: |
          APP_PATH="build/Build/Products/Release/Holeberry.app"
          DMG_NAME="Holeberry-${GITHUB_REF_NAME#v}.dmg"
          DMG_PATH="build/$DMG_NAME"

          mkdir -p build/dmg
          cp -R "$APP_PATH" build/dmg/
          ln -s /Applications build/dmg/Applications

          hdiutil create -volname "Holeberry" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG..HEAD" | sed 's/^/- /' > /tmp/changelog.txt
          else
            echo "- First release." > /tmp/changelog.txt
          fi
          {
            echo "body<<EOF"
            cat /tmp/changelog.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.dmg.outputs.dmg_path }}
          body: ${{ steps.changelog.outputs.body }}
          make_latest: true

      - name: Clone Sparkle (matching pinned version)
        run: |
          set -euo pipefail
          VERSION="${{ steps.sparkle-version.outputs.version }}"
          REPO="https://github.com/sparkle-project/Sparkle"

          SPARKLE_TAG=""
          for candidate in "$VERSION" "v$VERSION"; do
            if git ls-remote --exit-code --tags "$REPO" "refs/tags/$candidate" >/dev/null 2>&1; then
              SPARKLE_TAG="$candidate"
              break
            fi
          done

          if [[ -z "$SPARKLE_TAG" ]]; then
            echo "::error::Could not find Sparkle tag for version $VERSION"
            exit 1
          fi

          git clone --depth 1 --branch "$SPARKLE_TAG" --single-branch "$REPO" /tmp/sparkle-src
          echo "sparkle_tag=$SPARKLE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build generate_appcast
        run: |
          xcodebuild -project /tmp/sparkle-src/Sparkle.xcodeproj \
            -scheme generate_appcast \
            -configuration Release \
            -derivedDataPath /tmp/sparkle-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Switch to latest main
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - name: Generate signed appcast
        env:
          PRIVATE_SPARKLE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
        run: |
          cp "${{ steps.dmg.outputs.dmg_path }}" Updates/

          printf '%s' "$PRIVATE_SPARKLE_KEY" | \
            /tmp/sparkle-derived/Build/Products/Release/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
              -o Updates/appcast.xml \
              Updates/

      - name: Commit and push appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Updates/appcast.xml
          git diff --staged --quiet || git commit -m "chore: update appcast for ${{ github.ref_name }}"
          git push origin main
