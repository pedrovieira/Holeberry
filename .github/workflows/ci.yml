name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Run tests
        run: cd Packages/HoleberryCore && swift test

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict Sources/ Packages/HoleberryCore/Sources/

  swift-format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Run swift-format lint
        run: |
          FORMAT_BIN=$(xcrun --find swift-format)
          "$FORMAT_BIN" lint --recursive --strict Sources/ Packages/HoleberryCore/Sources/
          "$FORMAT_BIN" lint --recursive --strict --configuration Packages/HoleberryCore/.swift-format Packages/HoleberryCore/Tests/
