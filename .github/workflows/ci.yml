name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run ShellCheck
        run: find scripts/ci -type f -name '*.sh' -exec shellcheck {} +
      - name: Install Ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/python" -m pip install --disable-pip-version-check ruff==0.17.6
      - name: Run Ruff
        run: '"$RUNNER_TEMP/ruff/bin/ruff" check --no-cache --output-format=github scripts/ci'

  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Test release safeguards
        run: python3 -m unittest discover -s scripts/ci/tests
      - name: Run tests
        run: cd Packages/HoleberryCore && swift test

  lint:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict Sources/ Packages/HoleberryCore/Sources/

  swift-format:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Run swift-format lint
        run: |
          FORMAT_BIN=$(xcrun --find swift-format)
          "$FORMAT_BIN" lint --recursive --strict Sources/ Packages/HoleberryCore/Sources/
          "$FORMAT_BIN" lint --recursive --strict --configuration Packages/HoleberryCore/.swift-format Packages/HoleberryCore/Tests/
